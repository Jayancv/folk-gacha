openapi: 3.0.3
info:
  title: Folk Gacha API
  version: 0.1.0
  description: |
    Single source of truth for the API. Change this file first, then regenerate:
    - Go:         cd server && go generate ./...
    - TypeScript: cd web && npm run gen:api
servers:
  - url: http://localhost:8081
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and database check
      security: []
      responses:
        "200":
          description: Server and database are reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Server is up but the database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  schemas:
    Health:
      type: object
      required: [status, database, time]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [ok, down]
        time:
          type: string
          format: date-time
          description: Current server time in UTC
