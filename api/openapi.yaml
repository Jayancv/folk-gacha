openapi: 3.0.3
info:
  title: Folk Gacha API
  version: 0.1.0
  description: |
    Single source of truth for the API, split into one file per path (paths/, mirroring the URL)
    and one per schema (schemas/). Edit those files (and register new ones below), then regenerate:
    - Bundle + TypeScript: cd web && npm run gen:api   (writes api/openapi.bundled.yaml, then the TS types)
    - Go:                  cd server && go generate ./...   (reads api/openapi.bundled.yaml)
    Never edit openapi.bundled.yaml by hand.
servers:
  - url: http://localhost:8081
    description: Local development
security:
  - session: []
paths:
  /health:
    $ref: ./paths/health.yaml
  /auth/config:
    $ref: ./paths/auth/config.yaml
  /auth/google:
    $ref: ./paths/auth/google.yaml
  /auth/dev:
    $ref: ./paths/auth/dev.yaml
  /auth/logout:
    $ref: ./paths/auth/logout.yaml
  /me:
    $ref: ./paths/me.yaml
  /me/showcase:
    $ref: ./paths/me/showcase.yaml
  /me/tutorial:
    $ref: ./paths/me/tutorial.yaml
  /users/{username}:
    $ref: ./paths/users/{username}.yaml
  /users/{username}/cards:
    $ref: ./paths/users/{username}/cards.yaml
  /packs/daily/claim:
    $ref: ./paths/packs/daily/claim.yaml
  /cards:
    $ref: ./paths/cards.yaml
  /merges:
    $ref: ./paths/merges.yaml
  /recipes:
    $ref: ./paths/recipes.yaml
  /trades:
    $ref: ./paths/trades.yaml
  /trades/{tradeId}/accept:
    $ref: ./paths/trades/{tradeId}/accept.yaml
  /trades/{tradeId}/decline:
    $ref: ./paths/trades/{tradeId}/decline.yaml
  /trades/{tradeId}/cancel:
    $ref: ./paths/trades/{tradeId}/cancel.yaml
  /leaderboard/current:
    $ref: ./paths/leaderboard/current.yaml
  /leaderboard/{seasonId}:
    $ref: ./paths/leaderboard/{seasonId}.yaml
  /push/key:
    $ref: ./paths/push/key.yaml
  /push/subscriptions:
    $ref: ./paths/push/subscriptions.yaml
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: fg_session
      description: HttpOnly session cookie set by the sign-in endpoints
  schemas:
    Health:
      $ref: ./schemas/Health.yaml
    AuthConfig:
      $ref: ./schemas/AuthConfig.yaml
    Me:
      $ref: ./schemas/Me.yaml
    DailyPackStatus:
      $ref: ./schemas/DailyPackStatus.yaml
    DailyPack:
      $ref: ./schemas/DailyPack.yaml
    CardSort:
      $ref: ./schemas/CardSort.yaml
    CardPage:
      $ref: ./schemas/CardPage.yaml
    MergeResult:
      $ref: ./schemas/MergeResult.yaml
    DiscoveredRecipe:
      $ref: ./schemas/DiscoveredRecipe.yaml
    Rarity:
      $ref: ./schemas/Rarity.yaml
    Element:
      $ref: ./schemas/Element.yaml
    Card:
      $ref: ./schemas/Card.yaml
    CardTraits:
      $ref: ./schemas/CardTraits.yaml
    Error:
      $ref: ./schemas/Error.yaml
    Leaderboard:
      $ref: ./schemas/Leaderboard.yaml
    LeaderboardSeason:
      $ref: ./schemas/LeaderboardSeason.yaml
    LeaderboardEntry:
      $ref: ./schemas/LeaderboardEntry.yaml
    Profile:
      $ref: ./schemas/Profile.yaml
    PushKey:
      $ref: ./schemas/PushKey.yaml
    PushSubscription:
      $ref: ./schemas/PushSubscription.yaml
    Trade:
      $ref: ./schemas/Trade.yaml
    TradeItem:
      $ref: ./schemas/TradeItem.yaml
    TradeList:
      $ref: ./schemas/TradeList.yaml
    TradeStatus:
      $ref: ./schemas/TradeStatus.yaml
