openapi: 3.0.3
info:
  title: Folk Gacha API
  version: 0.1.0
  description: |
    Single source of truth for the API. Change this file first, then regenerate:
    - Go:         cd server && go generate ./...
    - TypeScript: cd web && npm run gen:api
servers:
  - url: http://localhost:8081
    description: Local development
security:
  - session: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and database check
      security: []
      responses:
        "200":
          description: Server and database are reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Server is up but the database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/config:
    get:
      operationId: getAuthConfig
      summary: Which sign-in options this server offers
      security: []
      responses:
        "200":
          description: Sign-in options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"
  /auth/google:
    post:
      operationId: signInWithGoogle
      summary: Sign in with a Google ID token (creates the account on first sign-in)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
                  description: The ID token (JWT) from Google Identity Services
      responses:
        "200":
          description: Signed in; the session cookie is set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: The Google token is invalid, expired, or for another app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Google sign-in is not configured on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/dev:
    post:
      operationId: signInDev
      summary: Development-only sign-in by name (disabled unless DEV_LOGIN=1)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 20
      responses:
        "200":
          description: Signed in; the session cookie is set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Name has no usable characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Dev sign-in is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      responses:
        "204":
          description: Signed out; the session cookie is cleared
          headers:
            Set-Cookie:
              schema:
                type: string
  /me:
    get:
      operationId: getMe
      summary: The signed-in player's profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: fg_session
      description: HttpOnly session cookie set by the sign-in endpoints
  schemas:
    Health:
      type: object
      required: [status, database, time]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [ok, down]
        time:
          type: string
          format: date-time
          description: Current server time in UTC
    AuthConfig:
      type: object
      required: [devLogin]
      properties:
        googleClientId:
          type: string
          description: OAuth client ID for the Google sign-in button; absent if Google sign-in is off
        devLogin:
          type: boolean
          description: Whether POST /auth/dev is enabled (local development only)
    Me:
      type: object
      required: [id, username, createdAt, tradeUnlockedAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        createdAt:
          type: string
          format: date-time
        tradeUnlockedAt:
          type: string
          format: date-time
          description: When this account may start trading (created + 7 days, UTC)
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Machine-readable code, e.g. invalid_token, not_signed_in
        message:
          type: string
