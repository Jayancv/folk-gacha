type: object
required:
  - day
  - cards
  - nextResetAt
properties:
  day:
    type: string
    format: date
    description: The UTC day this pack was claimed for
  cards:
    type: array
    items:
      $ref: ./Card.yaml
  nextResetAt:
    type: string
    format: date-time
    description: When the next pack can be claimed (00:00 UTC)
