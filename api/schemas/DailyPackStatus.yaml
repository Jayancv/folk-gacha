type: object
required:
  - ready
  - waiting
  - nextResetAt
properties:
  ready:
    type: boolean
    description: Whether a daily pack can be opened now (waiting > 0)
  waiting:
    type: integer
    description: Unopened daily packs (today's and saved-up ones, up to packs.maxUnopenedCards / 5)
  nextResetAt:
    type: string
    format: date-time
    description: Next daily reset (00:00 UTC)
