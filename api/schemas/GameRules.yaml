type: object
description: Game limits from server/rules/game.yaml
required:
  - maxTradeCards
  - dailyOfferLimit
  - offerExpiryHours
  - newAccountWaitDays
  - partnerGiftsPerWeek
  - dropChancePercent
  - pityPacks
  - maxUnopenedCards
properties:
  maxTradeCards:
    type: integer
    description: Most cards on each side of a trade offer
  dailyOfferLimit:
    type: integer
    description: Offers a player can send per UTC day
  offerExpiryHours:
    type: integer
    description: How long an offer stays open
  newAccountWaitDays:
    type: integer
    description: Days after sign-up before an account can trade (0 = none)
  partnerGiftsPerWeek:
    type: integer
    description: Partner gifts a player can get per leaderboard week (0 = gifts off)
  dropChancePercent:
    type: object
    description: Chance of each rarity per pack card, in percent (sums to 100)
    required:
      - common
      - uncommon
      - rare
      - epic
      - legendary
    properties:
      common:
        type: number
      uncommon:
        type: number
      rare:
        type: number
      epic:
        type: number
      legendary:
        type: number
  pityPacks:
    type: integer
    description: At least one Rare or better every this many daily packs
  maxUnopenedCards:
    type: integer
    description: Unopened daily packs are kept up to this many cards (a multiple of 5); older ones are lost
