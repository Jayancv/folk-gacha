type: object
required:
  - id
  - username
  - createdAt
  - tradeUnlockedAt
properties:
  id:
    type: string
    format: uuid
  username:
    type: string
  createdAt:
    type: string
    format: date-time
  tradeUnlockedAt:
    type: string
    format: date-time
    description: When this account may start trading (created + 7 days, UTC)
  dailyPack:
    $ref: ./DailyPackStatus.yaml
  displayName:
    type: string
    description: Your full name from Google (only ever shown to you); absent for dev logins
