# Local development database. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: cardgame-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cardgame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardgame}
      POSTGRES_DB: ${POSTGRES_DB:-cardgame}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
